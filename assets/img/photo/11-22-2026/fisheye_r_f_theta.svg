<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2230">Side view of the camera</text>
  <text x="590" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2230">Distance from image center</text>

  <!-- optical axis -->
  <line x1="200" y1="330" x2="200" y2="70" stroke="#5d6779" stroke-dasharray="5 5"/>
  <text x="208" y="84" fill="#5d6779">optical axis</text>

  <!-- circle of radius f (rest of the arc, faint) -->
  <path d="M322.6,227.2 A160,160 0 0 1 360,330" fill="none" stroke="#d9480f" stroke-opacity="0.3" stroke-width="2"/>
  <!-- pinhole plane (tangent at distance f) -->
  <line x1="200" y1="170" x2="440" y2="170" stroke="#1c6dd0" stroke-opacity="0.3" stroke-width="2"/>
  <text x="446" y="175" fill="#1c6dd0">pinhole image plane</text>

  <!-- incoming ray -->
  <line x1="200" y1="330" x2="429.8" y2="137.1" stroke="#1b2230" stroke-width="2"/>
  <text x="436" y="134" fill="#1b2230">incoming light</text>

  <!-- pinhole distance: f tan(theta) -->
  <line x1="200" y1="170" x2="390.7" y2="170" stroke="#1c6dd0" stroke-width="4"/>
  <circle cx="390.7" cy="170" r="5" fill="#1c6dd0"/>
  <text x="290" y="160" text-anchor="middle" fill="#1c6dd0">f tan θ</text>

  <!-- fisheye distance: arc length f*theta -->
  <path d="M200,170 A160,160 0 0 1 322.6,227.2" fill="none" stroke="#d9480f" stroke-width="4"/>
  <circle cx="322.6" cy="227.2" r="5" fill="#d9480f"/>
  <text x="218" y="222" fill="#d9480f">arc = f θ</text>

  <!-- angle theta -->
  <path d="M200,290 A40,40 0 0 1 230.6,304.3" fill="none" stroke="#1b2230" stroke-width="1.5"/>
  <text x="212" y="280" fill="#1b2230">θ</text>

  <!-- f -->
  <text x="184" y="255" text-anchor="end" fill="#5d6779">f</text>
  <line x1="190" y1="170" x2="190" y2="330" stroke="#5d6779"/>
  <line x1="185" y1="170" x2="195" y2="170" stroke="#5d6779"/>
  <line x1="185" y1="330" x2="195" y2="330" stroke="#5d6779"/>

  <circle cx="200" cy="330" r="6" fill="#1b2230"/>
  <text x="200" y="354" text-anchor="middle" fill="#1b2230">o (camera center)</text>

  <!-- right: the two distances laid flat, same scale -->
  <line x1="490" y1="70" x2="490" y2="230" stroke="#5d6779"/>
  <text x="490" y="62" text-anchor="middle" font-size="12" fill="#5d6779">center</text>

  <text x="496" y="98" fill="#d9480f">fisheye: r = f θ</text>
  <line x1="490" y1="112" x2="629.6" y2="112" stroke="#d9480f" stroke-width="6"/>
  <text x="496" y="134" font-size="12" fill="#5d6779">the arc, unrolled flat</text>

  <text x="496" y="178" fill="#1c6dd0">pinhole: r = f tan θ</text>
  <line x1="490" y1="192" x2="680.7" y2="192" stroke="#1c6dd0" stroke-width="6"/>
  <text x="496" y="214" font-size="12" fill="#5d6779">where the ray crosses the plane</text>

  <text x="490" y="282" font-size="13" fill="#1b2230">As θ → 90°:</text>
  <text x="490" y="304" font-size="13" fill="#1c6dd0">f tan θ → ∞ (never fits on a sensor)</text>
  <text x="490" y="326" font-size="13" fill="#d9480f">f θ → 1.57 f (stays finite)</text>
  <text x="490" y="366" font-size="12" fill="#5d6779">drawn for θ = 50°</text>
</svg>
