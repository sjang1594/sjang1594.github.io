<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="440" fill="#ffffff"/>

  <!-- optical axis -->
  <line x1="300" y1="380" x2="300" y2="60" stroke="#5d6779" stroke-dasharray="5 5"/>
  <text x="308" y="74" fill="#5d6779">optical axis</text>

  <!-- image plane, drawn in front of o -->
  <line x1="120" y1="180" x2="700" y2="180" stroke="#1b2230" stroke-width="4"/>
  <text x="708" y="185" fill="#1b2230">image plane</text>

  <!-- light from a 3D point to o -->
  <line x1="637" y1="97.1" x2="300" y2="380" stroke="#1b2230" stroke-width="2"/>
  <circle cx="637" cy="97.1" r="5" fill="#1b2230"/>
  <text x="648" y="94" fill="#1b2230">3D point</text>

  <!-- r for pinhole (above the plane) -->
  <line x1="300" y1="160" x2="538.4" y2="160" stroke="#1c6dd0" stroke-width="3"/>
  <line x1="538.4" y1="154" x2="538.4" y2="166" stroke="#1c6dd0" stroke-width="2"/>
  <text x="330" y="150" fill="#1c6dd0">r = f tan θ (pinhole)</text>

  <!-- r for fisheye (below the plane) -->
  <line x1="300" y1="200" x2="474.5" y2="200" stroke="#d9480f" stroke-width="3"/>
  <line x1="474.5" y1="194" x2="474.5" y2="206" stroke="#d9480f" stroke-width="2"/>
  <text x="330" y="222" fill="#d9480f">r = f θ (fisheye)</text>

  <!-- landing points on the plane -->
  <circle cx="300" cy="180" r="5" fill="#1b2230"/>
  <circle cx="538.4" cy="180" r="6" fill="#1c6dd0" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="474.5" cy="180" r="6" fill="#d9480f" stroke="#ffffff" stroke-width="1.5"/>
  <text x="288" y="170" text-anchor="end" fill="#1b2230">image center (r = 0)</text>

  <!-- theta -->
  <path d="M300,330 A50,50 0 0 1 338.3,347.9" fill="none" stroke="#1b2230" stroke-width="1.5"/>
  <text x="314" y="318" fill="#1b2230">θ</text>

  <!-- f -->
  <line x1="280" y1="184" x2="280" y2="380" stroke="#5d6779"/>
  <line x1="275" y1="380" x2="285" y2="380" stroke="#5d6779"/>
  <text x="270" y="290" text-anchor="end" fill="#5d6779">f</text>

  <!-- camera center -->
  <circle cx="300" cy="380" r="6" fill="#1b2230"/>
  <text x="300" y="406" text-anchor="middle" fill="#1b2230">o (camera center)</text>

  <!-- legend -->
  <circle cx="486" cy="305" r="6" fill="#1c6dd0"/>
  <text x="500" y="310" fill="#1b2230">pinhole: where the light crosses the plane</text>
  <circle cx="486" cy="335" r="6" fill="#d9480f"/>
  <text x="500" y="340" fill="#1b2230">fisheye: the same light is recorded closer in</text>
  <text x="480" y="378" font-size="12" fill="#5d6779">The real sensor sits behind o. The plane drawn here is</text>
  <text x="480" y="394" font-size="12" fill="#5d6779">its mirror image in front of o, so the image is not flipped.</text>
</svg>
